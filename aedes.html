<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aedes | Portal DMA</title>
  
  <link rel="icon" href="./assets/icon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./css/global.css" />

  <style>
    :root {
      --primary-blue: #0b3d91;
      --dark-blue: #001d3d;
      --accent-green: #22c55e;
      --accent-yellow: #facc15;
      --white: #ffffff;
      --bg-canvas: #cbd5e1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      height: 100vh; width: 100vw;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-canvas);
    }

    .viewport-wrapper {
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2.5vh 2.5vw;
    }

    .main-canvas {
      width: 100%; height: 100%;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* TOPBAR */
    .aedes-topbar {
      height: 9vh; min-height: 75px;
      padding: 0 2vw;
      display: flex; justify-content: space-between; align-items: center;
      background: var(--white);
      border-bottom: 1px solid #e2e8f0;
      z-index: 10;
    }

    .nav-group { display: flex; align-items: center; gap: 12px; }

    .btn-nav-yellow {
      background: var(--accent-yellow); color: var(--dark-blue);
      padding: 10px 18px; border-radius: 8px;
      font-weight: 800; font-size: 0.75rem; text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 10px rgba(250, 204, 21, 0.2); transition: 0.3s;
    }

    .btn-nav-green {
      background: var(--accent-green); color: white;
      padding: 10px 18px; border-radius: 8px;
      font-weight: 800; font-size: 0.75rem; text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.2); transition: 0.3s;
    }

    .btn-nav-yellow:hover, .btn-nav-green:hover { transform: translateY(-2px); filter: brightness(1.1); }

    /* CONTEÚDO SPLIT */
    .aedes-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 91vh;
    }

    .split-col {
      display: flex; flex-direction: column;
      align-items: center;
      height: 100%;
      padding: 2vh;
    }

    /* LADO ESQUERDO */
    .col-visual {
      background: #ffffff;
      justify-content: flex-start;
    }

    .image-container {
      width: 85%;
      height: 80%;
      margin-top: 5vh;
      background-image: url('./assets/dengue_icon2.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* LADO DIREITO */
    .col-form {
      background: linear-gradient(145deg, var(--dark-blue) 0%, var(--primary-blue) 100%);
      color: white;
      justify-content: center;
    }

    .glass-box {
      width: 85%;
      max-width: 420px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 10vh;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; color: #cbd5e1; }
    
    .custom-input {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: white; font-weight: 600; font-size: 1rem; color: var(--dark-blue);
    }

    .btn-main {
      width: 100%; padding: 16px; border-radius: 10px; border: none;
      font-weight: 800; cursor: pointer; transition: 0.3s;
    }

    .btn-verify { background: var(--accent-green); color: white; margin-bottom: 12px; }

    @media (max-width: 900px) {
      .aedes-content { grid-template-columns: 1fr; overflow-y: auto; }
      .col-visual { display: none; }
      .glass-box { margin-bottom: 20px; margin-top: 20px; }
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <div class="main-canvas">
      
      <header class="aedes-topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="background: var(--primary-blue); color:white; padding:6px 12px; border-radius:8px; font-weight:900; font-size:0.75rem;">DMA</div>
          <strong style="color:var(--dark-blue); font-size:1rem;">Programa de Combate ao Aedes aegypti</strong>
        </div>

        <div class="nav-group">
          <a href="./index.html" class="btn-nav-green">
            <i class="fas fa-home"></i>
            <span>PORTAL DMA</span>
          </a>
          <a href="./aedes-focais.html" class="btn-nav-yellow">
            <i class="fas fa-file-signature"></i>
            <span>ENVIAR RELATÓRIO</span>
          </a>
        </div>
      </header>

      <div class="aedes-content">
        <section class="split-col col-visual">
          <div class="image-container"></div>
        </section>

        <section class="split-col col-form">
          <div class="glass-box">
            <h2 style="font-size: 1.8rem; margin-bottom: 10px; letter-spacing: -0.5px;">Consulta Online</h2>
            <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 30px;">Verifique a elegibilidade da sua unidade.</p>

            <div class="field">
              <label>Unidade Operacional</label>
              <select id="certUnidade" class="custom-input">
                <option value="">Carregando unidades...</option>
              </select>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
              <div class="field">
                <label>Mês de Referência</label>
                <select id="certMes" class="custom-input">
                  <option value="1">Janeiro</option>
                  <option value="2">Fevereiro</option>
                  <option value="3" selected>Março</option>
                  <option value="4">Abril</option>
                  <option value="5">Maio</option>
                  <option value="6">Junho</option>
                  <option value="7">Julho</option>
                  <option value="8">Agosto</option>
                  <option value="9">Setembro</option>
                  <option value="10">Outubro</option>
                  <option value="11">Novembro</option>
                  <option value="12">Dezembro</option>
                </select>
              </div>
              <div class="field">
                <label>Ano</label>
                <select id="certAno" class="custom-input">
                  <option value="2025">2025</option>
                  <option value="2026" selected>2026</option>
                </select>
              </div>
            </div>

            <button id="checkCertificateBtn" class="btn-main btn-verify" onclick="verificarElegibilidade()">VERIFICAR STATUS</button>
            <button id="downloadCertificateBtn" class="btn-main" style="background:white; color:var(--primary-blue); opacity:0.5;" disabled>BAIXAR CERTIFICADO</button>
          </div>
        </section>
      </div>

    </div>
  </div>

  <!--
    ORDEM CORRETA DE SCRIPTS:
    1. api-config.js primeiro (define window.AEDES_API_BASE_URL)
    2. aedes-publico.js depois (consome a variável global acima)
    Removido certs.js pois não é usado nesta página
  -->
  <script src="./js/core/api-config.js"></script>
  <script src="./js/certs.js"></script>
  <script type="module" src="./js/pages/aedes-publico.js"></script>

</body>
</html>
